<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#eef2f6;color:#1e293b;font-size:14px;margin:0}
:root{--g:#0f766e;--g2:#14b8a6;--g3:#ccfbf1;--d:#0b3b36;--gray:#64748b}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f766e,#134e4a 55%,#052e2b)}
.login-card{background:#fff;border-radius:18px;box-shadow:0 25px 60px rgba(0,0,0,.3);padding:34px;width:100%;max-width:430px}
.brand{text-align:center;margin-bottom:22px}
.brand .logo{width:70px;height:70px;border-radius:50%;background:var(--g3);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 14px}
.brand h1{font-size:16px;color:var(--g);letter-spacing:.4px}
.brand h2{font-size:12.5px;color:var(--gray);font-weight:500;margin-top:8px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 6px;color:#334155}
input,select{width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;font-family:inherit;background:#f8fafc;color:#1e293b}
input:focus,select:focus{outline:none;border-color:var(--g2);background:#fff;box-shadow:0 0 0 3px rgba(20,184,166,.15)}
button{font-family:inherit;cursor:pointer;border:none}
.btn{background:var(--g);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;width:100%}
.btn:hover{background:#115e59}
.btn-sm{padding:7px 12px;font-size:12.5px;width:auto;border-radius:8px}
.btn-2{background:#0d9488}.btn-3{background:#64748b}.btn-4{background:#b91c1c}.btn-5{background:#0369a1}
.hint{margin-top:18px;font-size:11.5px;color:var(--gray);text-align:center;line-height:1.7;background:#f8fafc;padding:10px;border-radius:10px}
.topbar{background:linear-gradient(135deg,var(--g),var(--d));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brandmini{display:flex;align-items:center;gap:10px}
.brandmini b{display:block;font-size:13px}
.brandmini small{display:block;font-size:11px;opacity:.85}
.spacer{flex:1}
.userbox{font-size:12px;background:rgba(255,255,255,.15);padding:7px 12px;border-radius:20px}
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
.sidebar{width:232px;background:#fff;border-right:1px solid #e2e8f0;padding:14px 10px;flex-shrink:0}
.sidebar a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;color:#334155;text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:3px;cursor:pointer}
.sidebar a:hover{background:#f1f5f9}
.sidebar a.active{background:var(--g3);color:var(--g);font-weight:700}
main{flex:1;padding:22px;min-width:0}
h3.pt{font-size:18px;color:var(--d);margin-bottom:4px}
p.ps{font-size:12.5px;color:var(--gray);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:14px;padding:18px;border-left:5px solid var(--g);box-shadow:0 2px 10px rgba(15,23,42,.06)}
.stat .v{font-size:26px;font-weight:800;color:var(--g)}
.stat .l{font-size:12px;color:var(--gray);margin-top:4px}
.card2{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.06);margin-bottom:18px}
.card2 h4{font-size:14px;color:var(--d);margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #f1f5f9}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef2f6}
th{background:#f8fafc;font-size:12px;text-transform:uppercase;color:#475569;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.b-L{background:#dcfce7;color:#166534}
.b-CL{background:#dbeafe;color:#1e40af}
.b-KL{background:#fef3c7;color:#92400e}
.b-0{background:#f1f5f9;color:#94a3b8}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:170px;padding:9px 12px;font-size:13px}
.foot{text-align:center;font-size:11.5px;color:var(--gray);padding:18px;line-height:1.6}
.empty{padding:40px 20px;text-align:center;color:#94a3b8}
.info-box{background:#eff6ff;border-left:4px solid #3b82f6;padding:12px 16px;border-radius:8px;font-size:12.5px;color:#1e40af;line-height:1.7;margin-bottom:16px}
body.pub-mode{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
body.pub-mode .hero{overflow:visible;padding:28px 20px 20px;flex-shrink:0}
body.pub-mode .hero-ornament{width:52px;height:52px;font-size:24px;margin-bottom:10px}
body.pub-mode .hero-eyebrow{font-size:9.5px;margin-bottom:8px}
body.pub-mode .hero h1{font-size:22px;margin-bottom:6px}
body.pub-mode .hero p{font-size:12px;margin-bottom:16px;line-height:1.5}
body.pub-mode .hero-search{margin-bottom:0}
body.pub-mode .hero-chips{margin-top:12px}
body.pub-mode .pub-results{flex:1;min-height:0;overflow-y:auto;margin:0;max-width:none;width:100%;padding:14px 20px 16px;scroll-behavior:smooth}
body.pub-mode .pub-results::-webkit-scrollbar{width:6px}
body.pub-mode .pub-results::-webkit-scrollbar-thumb{background:rgba(15,81,50,.25);border-radius:3px}
body.pub-mode .pub-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
body.pub-mode .foot{display:none}
body.pub-mode .pub-toolbar{padding:10px 18px;margin-bottom:12px}
body.pub-mode .pub-card{padding:14px 18px}
body.pub-mode .pub-card .rows div{padding:3px 0}
body.pub-mode .hero-admin{top:14px;right:16px}
@keyframes pubFadeIn{from{opacity:0}to{opacity:1}}
@keyframes pubFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pubPulse{0%,100%{box-shadow:0 15px 40px rgba(0,0,0,.3),0 0 0 1px rgba(201,169,97,.2)}50%{box-shadow:0 15px 40px rgba(0,0,0,.3),0 0 0 3px rgba(201,169,97,.45)}}
.hero-inner{animation:pubFadeIn .5s ease-out}
.hero-ornament{animation:pubFadeIn .8s ease-out}
.hero-search{animation:pubPulse 4s ease-in-out infinite}
.pub-card{animation:pubFadeUp .35s ease-out backwards;transition:transform .18s,box-shadow .18s}
.pub-card:nth-child(1){animation-delay:0ms}
.pub-card:nth-child(2){animation-delay:30ms}
.pub-card:nth-child(3){animation-delay:60ms}
.pub-card:nth-child(4){animation-delay:90ms}
.pub-card:nth-child(5){animation-delay:120ms}
.pub-card:nth-child(6){animation-delay:150ms}
.pub-card:nth-child(7){animation-delay:180ms}
.pub-card:nth-child(8){animation-delay:210ms}
.pub-card:nth-child(9){animation-delay:240ms}
.pub-card:nth-child(10){animation-delay:270ms}
.pub-card:nth-child(11){animation-delay:300ms}
.pub-card:nth-child(12){animation-delay:330ms}
.pub-hint{animation:pubFadeUp .2s ease-out backwards}
.pub-hint:nth-child(1){animation-delay:0ms}
.pub-hint:nth-child(2){animation-delay:20ms}
.pub-hint:nth-child(3){animation-delay:40ms}
.pub-hint:nth-child(4){animation-delay:60ms}
.pub-hint:nth-child(5){animation-delay:80ms}
.pub-hint:nth-child(6){animation-delay:100ms}
.pub-hint:nth-child(7){animation-delay:120ms}
.pub-hint:nth-child(8){animation-delay:140ms}
.pub-detail{animation:pubFadeUp .35s ease-out}
@media(max-width:640px){
  body.pub-mode .hero{padding:20px 14px 16px}
  body.pub-mode .hero-ornament{width:44px;height:44px;font-size:20px;margin-bottom:8px}
  body.pub-mode .hero h1{font-size:19px}
  body.pub-mode .hero p{font-size:11.5px;margin-bottom:12px}
  body.pub-mode .hero-search input{font-size:14px;padding:12px 14px}
  body.pub-mode .hero-search button{padding:12px 18px;font-size:13px}
  body.pub-mode .pub-results{padding:10px 12px 12px}
  body.pub-mode .pub-grid{grid-template-columns:1fr;gap:8px}
  body.pub-mode .pub-card{padding:12px 14px}
  body.pub-mode .pub-toolbar{padding:8px 14px;font-size:12px}
}
</style>

<style>
.pub-hints{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 15px 45px rgba(0,0,0,.18),0 0 0 1px rgba(201,169,97,.15);overflow:hidden;z-index:50;display:none;text-align:left;max-height:380px;overflow-y:auto}
.pub-hints.open{display:block;animation:pubFade .15s ease-out}
@keyframes pubFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.pub-hint{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background .12s}
.pub-hint:last-child{border-bottom:none}
.pub-hint:hover,.pub-hint.focus{background:#f8fafc}
.pub-hint .hint-icon{width:34px;height:34px;border-radius:9px;background:var(--g3);color:var(--g);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pub-hint .hint-body{flex:1;min-width:0}
.pub-hint .hint-name{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pub-hint .hint-name mark{background:rgba(201,169,97,.4);color:var(--ink);padding:0 2px;border-radius:2px;font-weight:700}
.pub-hint .hint-meta{font-size:11.5px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pub-detail-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--g);font-weight:600;font-size:13px;cursor:pointer;padding:8px 0;margin-bottom:14px;font-family:inherit}
.pub-detail-back:hover{color:var(--gold)}
.pub-detail{background:#fff;border-radius:16px;padding:32px;box-shadow:0 8px 30px rgba(0,0,0,.08);border-top:4px solid var(--gold)}
.pub-detail h2{font-family:Georgia,serif;font-size:26px;color:var(--ink);margin-bottom:10px;line-height:1.3}
.pub-detail .pd-kelas{display:inline-block;font-size:12px;color:var(--g);background:var(--g3);padding:4px 14px;border-radius:12px;font-weight:700;letter-spacing:.4px;margin-bottom:24px}
.pub-detail .pd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;padding:20px 0;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;margin-bottom:24px}
.pub-detail .pd-stat-label{font-size:10.5px;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600}
.pub-detail .pd-stat-val{font-weight:700;font-size:16px;color:var(--ink)}

var LSKEY="mit_alfalah_tahfidz_v2";
var DB=null, SESS=null, PAGE="dashboard";
function defaultDB(){return{users:[{u:"admin",p:"admin123",role:"admin",nama:"Administrator"},{u:"guru",p:"guru123",role:"guru",nama:"Guru Tahfidz"}],siswa:[],riwayat:[]};}
function loadDB(){try{var t=localStorage.getItem(LSKEY);DB=t?JSON.parse(t):defaultDB();if(!DB.siswa)DB.siswa=[];if(!DB.riwayat)DB.riwayat=[];}catch(e){DB=defaultDB();}}

function $(id){return document.getElementById(id);}
function badge(n){if(!n)return'<span class="badge b-0">Belum</span>';return'<span class="badge b-'+n+'">'+n+'</span>';}
function renderLogin(msg){document.body.classList.remove("pub-mode");$("app").innerHTML='<div class="login-wrap"><div class="login-card"><div class="brand"><div class="logo">&#128214;</div><h1>'+APPNAME+'</h1><h2>'+SUBJUDUL+'</h2></div><label>Username</label><input id="lu" autocomplete="off"><label>Password</label><input id="lp" type="password">'+(msg?'<div style="color:#b91c1c;font-size:12px;margin-top:10px">'+msg+'</div>':'')+'<div style="height:18px"></div><button class="btn" onclick="doLogin()">Masuk</button><div class="hint"><b>Akun Admin/Guru</b><br>admin/admin123 &middot; guru/guru123</div><div style="text-align:center;margin-top:14px"><a href="javascript:void(0)" onclick="gotoPublic()" style="color:#0f766e;font-size:12.5px;text-decoration:none">&larr; Kembali ke halaman informasi</a></div></div></div>';var lp=$("lp");if(lp)lp.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});}
function doLogin(){var u=$("lu").value.trim(),p=$("lp").value;var user=null;for(var i=0;i<DB.users.length;i++){if(DB.users[i].u===u&&DB.users[i].p===p){user=DB.users[i];break;}}if(!user){renderLogin("Username atau password salah.");return;}SESS={u:user.u,nama:user.nama,role:user.role};try{sessionStorage.setItem("mit_alfalah_sess",JSON.stringify(SESS));}catch(e){}PAGE="dashboard";renderApp();}
function logout(){SESS=null;try{sessionStorage.removeItem("mit_alfalah_sess");}catch(e){}PUBLIC=true;PAGE="monitoring";try{history.replaceState(null,"",location.pathname);}catch(e){}renderPublic();}
function renderApp(){document.body.classList.remove("pub-mode");var items=[["dashboard","&#128202;","Dashboard"],["siswa","&#128101;","Data Siswa"],["setoran","&#9997;","Input Setoran"],["rekap","&#128203;","Rekap"],["laporan","&#128424;","Laporan"]];
var nav=items.map(function(it){return'<a class="'+(PAGE===it[0]?"active":"")+'" onclick="go(\''+it[0]+'\')"><span>'+it[1]+'</span>'+it[2]+'</a>';}).join("");

var total=DB.siswa.length;var sudah=DB.siswa.filter(function(s){return s.nilai!="";}).length;var belum=total-sudah;var cnt={L:0,CL:0,KL:0};DB.siswa.forEach(function(s){if(cnt[s.nilai]!==undefined)cnt[s.nilai]++;});var pct=total?Math.round(sudah*100/total):0;

var rows=kelasList.map(function(k){var a=DB.siswa.filter(function(s){return s.kelas===k;});function f(v){return a.filter(function(s){return s.nilai===v;}).length;}var bl=a.length-f("L")-f("CL")-f("KL");return'<tr><td><b>'+esc(k)+'</b></td><td>'+a.length+'</td><td>'+f("L")+'</td><td>'+f("CL")+'</td><td>'+f("KL")+'</td><td>'+bl+'</td></tr>';}).join("");

function pageSiswa(){if(DB.siswa.length===0){$("main").innerHTML='<h3 class="pt">Data Siswa</h3><p class="ps">'+SEKOLAH+'</p><div class="info-box"><b>Belum ada data</b>Download template, isi, import. Atau tambah manual.</div><div class="card2"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-sm btn-2" onclick="downloadTemplate()">Download Template</button><button class="btn btn-sm btn-5" onclick="bukaImport()">Import CSV</button>'+(SESS.role==="admin"?'<button class="btn btn-sm btn-3" onclick="formSiswa()">+ Tambah</button>':'')+'</div></div>'+footer();return;}
var cari=(window._cariSiswa||"").toLowerCase();var fkelas=(window._filterKelas||"");var kelasList=[];DB.siswa.forEach(function(s){if(kelasList.indexOf(s.kelas)<0)kelasList.push(s.kelas);});kelasList.sort();
var data=DB.siswa.filter(function(s){var okN=!cari||s.nama.toLowerCase().indexOf(cari)>=0;var okK=!fkelas||s.kelas===fkelas;return okN&&okK;});
var rows=data.map(function(s,i){return'<tr><td>'+(i+1)+'</td><td><b>'+esc(s.kelas)+'</b></td><td>'+esc(s.nama)+'</td><td>'+esc(s.surat||"-")+'</td><td>'+esc(s.ayat||"-")+'</td><td>'+badge(s.nilai)+'</td><td><button class="btn btn-sm btn-2" onclick="formSiswa(\''+s.id+'\')">Edit</button> '+(SESS.role==="admin"?'<button class="btn btn-sm btn-4" onclick="hapusSiswa(\''+s.id+'\')">Hapus</button>':'')+'</td></tr>';}).join("");
if(!rows)rows='<tr><td colspan="7" style="text-align:center">Tidak ada data</td></tr>';
$("main").innerHTML='<h3 class="pt">Data Siswa</h3><p class="ps">Total '+DB.siswa.length+' siswa</p><div class="toolbar"><input placeholder="Cari..." value="'+esc(window._cariSiswa||"")+'" oninput="window._cariSiswa=this.value;pageSiswa()"><select onchange="window._filterKelas=this.value;pageSiswa()"><option value="">Semua Kelas</option>'+kelasList.map(function(k){return'<option '+(fkelas===k?"selected":"")+'>'+esc(k)+'</option>';}).join("")+'</select>'+(SESS.role==="admin"?'<button class="btn btn-sm btn-2" onclick="formSiswa()">+ Tambah</button>':'')+'<button class="btn btn-sm btn-5" onclick="bukaImport()">Import CSV</button><button class="btn btn-sm btn-2" onclick="downloadTemplate()">Template</button>'+(SESS.role==="admin"?'<button class="btn btn-sm btn-4" onclick="hapusSemua()">Reset</button>':'')+'</div><div class="card2"><table><thead><tr><th>No</th><th>Kelas</th><th>Nama</th><th>Surat</th><th>Ayat</th><th>Nilai</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+footer();}
function hapusSemua(){if(!confirm("Hapus SEMUA data?"))return;DB.siswa=[];DB.riwayat=[];saveDB();pageSiswa();}
function modal(html,maxw){var d=document.createElement("div");d.id="modalBox";d.style.cssText="position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999;overflow:auto";d.innerHTML='<div style="background:#fff;border-radius:16px;padding:24px;max-width:'+(maxw||460)+'px;width:100%;max-height:90vh;overflow:auto">'+html+'</div>';document.body.appendChild(d);}
function closeModal(){var m=document.getElementById("modalBox");if(m)m.remove();}
function formSiswa(id){var s=id?DB.siswa.filter(function(x){return x.id===id;})[0]:{kelas:"",nama:"",surat:"",ayat:"",nilai:""};if(!s)return;
modal('<h4>'+(id?"Edit":"Tambah")+' Siswa</h4><label>Kelas</label><input id="f_kelas" value="'+esc(s.kelas)+'"><label>Nama</label><input id="f_nama" value="'+esc(s.nama)+'"><label>Surat</label><input id="f_surat" value="'+esc(s.surat)+'"><label>Ayat</label><input id="f_ayat" value="'+esc(s.ayat)+'"><label>Nilai</label><select id="f_nilai">'+["","L","CL","KL"].map(function(v){return'<option value="'+v+'" '+(s.nilai===v?"selected":"")+'>'+(v||"- Belum -")+'</option>';}).join("")+'</select><div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-2" onclick="simpanSiswa(\''+(id||"")+'\')">Simpan</button><button class="btn btn-3" onclick="closeModal()">Batal</button></div>');}
function simpanSiswa(id){var kelas=$("f_kelas").value.trim();var nama=$("f_nama").value.trim();if(!kelas||!nama){alert("Kelas & nama wajib.");return;}var obj={kelas:kelas,nama:nama,surat:$("f_surat").value.trim(),ayat:$("f_ayat").value.trim(),nilai:$("f_nilai").value};
if(id){for(var i=0;i<DB.siswa.length;i++){if(DB.siswa[i].id===id){DB.siswa[i]=Object.assign(DB.siswa[i],obj);}}}else{obj.id="S"+Date.now()+"_"+Math.floor(Math.random()*1000);DB.siswa.push(obj);}
saveDB();closeModal();pageSiswa();}
function hapusSiswa(id){if(!confirm("Hapus?"))return;DB.siswa=DB.siswa.filter(function(s){return s.id!==id;});DB.riwayat=DB.riwayat.filter(function(r){return r.sid!==id;});saveDB();pageSiswa();}
function pageSetoran(){if(DB.siswa.length===0){$("main").innerHTML='<h3 class="pt">Input Setoran</h3><p class="ps">'+SEKOLAH+'</p><div class="info-box">Tambah data siswa dulu lewat menu Data Siswa.</div>'+footer();return;}
var kelasList=[];DB.siswa.forEach(function(s){if(kelasList.indexOf(s.kelas)<0)kelasList.push(s.kelas);});kelasList.sort();
var fk=(window._setorKelas||"");var filtered=fk?DB.siswa.filter(function(s){return s.kelas===fk;}):DB.siswa;
var opts=filtered.map(function(s){return'<option value="'+s.id+'">'+esc(s.kelas)+' &middot; '+esc(s.nama)+'</option>';}).join("");
var today=new Date().toISOString().slice(0,10);
var riwayat=DB.riwayat.slice(0,12).map(function(r){var s=null;for(var i=0;i<DB.siswa.length;i++){if(DB.siswa[i].id===r.sid){s=DB.siswa[i];break;}}return'<tr><td>'+esc(r.tgl)+'</td><td>'+(s?esc(s.kelas)+' - '+esc(s.nama):'-')+'</td><td>'+esc(r.surat)+' '+esc(r.ayat)+'</td><td>'+badge(r.nilai)+'</td></tr>';}).join("");
if(!riwayat)riwayat='<tr><td colspan="4" style="text-align:center">Belum ada</td></tr>';
$("main").innerHTML='<h3 class="pt">Input Setoran</h3><p class="ps">'+SEKOLAH+'</p><div class="card2"><h4>Form</h4><label>Filter Kelas</label><select onchange="window._setorKelas=this.value;pageSetoran()"><option value="">Semua</option>'+kelasList.map(function(k){return'<option '+(fk===k?"selected":"")+'>'+esc(k)+'</option>';}).join("")+'</select><label>Siswa</label><select id="s_siswa">'+opts+'</select><label>Surat</label><input id="s_surat"><label>Ayat</label><input id="s_ayat"><label>Nilai</label><select id="s_nilai"><option>L</option><option>CL</option><option>KL</option></select><label>Tanggal</label><input id="s_tgl" type="date" value="'+today+'"><div style="height:18px"></div><button class="btn btn-2" onclick="simpanSetoran()">Simpan</button></div><div class="card2"><h4>Riwayat</h4><table><thead><tr><th>Tanggal</th><th>Siswa</th><th>Surat/Ayat</th><th>Nilai</th></tr></thead><tbody>'+riwayat+'</tbody></table></div>'+footer();}
function simpanSetoran(){var id=$("s_siswa").value;var surat=$("s_surat").value.trim();var ayat=$("s_ayat").value.trim();var nilai=$("s_nilai").value;var tgl=$("s_tgl").value;if(!surat){alert("Surat wajib.");return;}
for(var i=0;i<DB.siswa.length;i++){if(DB.siswa[i].id===id){DB.siswa[i].surat=surat;DB.siswa[i].ayat=ayat;DB.siswa[i].nilai=nilai;}}
DB.riwayat.unshift({sid:id,tgl:tgl,surat:surat,ayat:ayat,nilai:nilai,guru:SESS.nama});
saveDB();alert("Tersimpan.");pageSetoran();}

var kelasList=[];DB.siswa.forEach(function(s){if(kelasList.indexOf(s.kelas)<0)kelasList.push(s.kelas);});kelasList.sort();
var kelas=(window._rekapKelas||"");var data=DB.siswa.filter(function(s){return!kelas||s.kelas===kelas;});var no=0;
var rows=data.map(function(s){no++;return'<tr><td>'+no+'</td><td><b>'+esc(s.kelas)+'</b></td><td>'+esc(s.nama)+'</td><td>'+esc(s.surat||"-")+'</td><td>'+esc(s.ayat||"-")+'</td><td>'+badge(s.nilai)+'</td></tr>';}).join("");
$("main").innerHTML='<h3 class="pt">Rekap Hafalan</h3><p class="ps">'+SEKOLAH+'</p><div class="toolbar"><select onchange="window._rekapKelas=this.value;pageRekap()"><option value="">Semua</option>'+kelasList.map(function(k){return'<option '+(kelas===k?"selected":"")+'>'+esc(k)+'</option>';}).join("")+'</select><button class="btn btn-sm btn-2" onclick="exportCSV()">Export CSV</button><button class="btn btn-sm btn-3" onclick="window.print()">Cetak</button></div><div class="card2"><table><thead><tr><th>No</th><th>Kelas</th><th>Nama</th><th>Surat</th><th>Ayat</th><th>Nilai</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+footer();}
function pageLaporan(){var total=DB.siswa.length;var sudah=DB.siswa.filter(function(s){return s.nilai!="";}).length;var pct=total?Math.round(sudah*100/total):0;
$("main").innerHTML='<h3 class="pt">Laporan</h3><p class="ps">'+SEKOLAH+'</p><div class="card2"><h4>Ringkasan</h4><table><tbody><tr><td>Sekolah</td><td><b>'+SEKOLAH+'</b></td></tr><tr><td>Aplikasi</td><td>'+APPNAME+'</td></tr><tr><td>Total Siswa</td><td>'+total+'</td></tr><tr><td>Sudah Setoran</td><td>'+sudah+' ('+pct+'%)</td></tr></tbody></table></div><div class="card2"><h4>Export</h4><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-sm btn-2" onclick="exportCSV()">Export CSV</button><button class="btn btn-sm btn-3" onclick="window.print()">Cetak/PDF</button></div></div>'+footer();}
function pageMonitoring(){if(DB.siswa.length===0){$("main").innerHTML='<h3 class="pt">Monitoring</h3><p class="ps">'+SEKOLAH+'</p><div class="info-box">Belum ada data.</div>'+footer();return;}
var kelasList=[];DB.siswa.forEach(function(s){if(kelasList.indexOf(s.kelas)<0)kelasList.push(s.kelas);});kelasList.sort();var fk=(window._waliKelas||"");var cari=(window._cariWali||"").toLowerCase();var data=DB.siswa.filter(function(s){var okK=!fk||s.kelas===fk;var okN=!cari||s.nama.toLowerCase().indexOf(cari)>=0;return okK&&okN;});
var cards=data.map(function(s){var riwayat=DB.riwayat.filter(function(r){return r.sid===s.id;}).slice(0,5).map(function(r){return'<tr><td>'+esc(r.tgl)+'</td><td>'+esc(r.surat)+' '+esc(r.ayat)+'</td><td>'+badge(r.nilai)+'</td></tr>';}).join("");if(!riwayat)riwayat='<tr><td colspan="3">Belum ada</td></tr>';
return'<div class="card2"><h4>'+esc(s.nama)+' <span style="float:right;font-size:12px">Kelas '+esc(s.kelas)+'</span></h4><table><tbody><tr><td>Surat</td><td><b>'+esc(s.surat||"-")+'</b></td></tr><tr><td>Ayat</td><td>'+esc(s.ayat||"-")+'</td></tr><tr><td>Nilai</td><td>'+badge(s.nilai)+'</td></tr></tbody></table><p style="font-size:12px;font-weight:700;margin:14px 0 8px">Riwayat</p><table><thead><tr><th>Tanggal</th><th>Surat</th><th>Nilai</th></tr></thead><tbody>'+riwayat+'</tbody></table></div>';}).join("");
$("main").innerHTML='<h3 class="pt">Monitoring Anak</h3><p class="ps">'+SEKOLAH+'</p><div class="toolbar"><input placeholder="Cari..." value="'+esc(window._cariWali||"")+'" oninput="window._cariWali=this.value;pageMonitoring()"></div>'+cards+footer();}
function exportCSV(){var rows=[["SISTEM INFORMASI MONITORING TAHFIDZ"],["MIT Al-Falah"],[SUBJUDUL],[]];rows.push(["NO","KELAS","NAMA","SURAT","AYAT","NILAI"]);DB.siswa.forEach(function(s,i){rows.push([i+1,s.kelas,s.nama,s.surat,s.ayat,s.nilai]);});

var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="Rekap-MIT-Al-Falah.csv";document.body.appendChild(a);a.click();a.remove();}
function downloadTemplate(){var csv="\uFEFFKELAS,NAMA SISWA,SURAT,AYAT,NILAI\r\n4B,Contoh Nama,Abasa,6,L\r\n";var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="Template-MIT-Al-Falah.csv";document.body.appendChild(a);a.click();a.remove();}
